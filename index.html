<style>
  :root{
    --bg:#0f1b1e;
    --panel:#132a2c;
    --panel2:#173438;
    --line:#25474b;
    --ink:#eef7f5;
    --muted:#9fc2bf;
    --accent:#ff7a45;
    --accent2:#2fbf8f;
    --pending:#e7b23c;
    --danger:#e2554f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;padding:18px 16px 80px;}
  header{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;}
  header .eyebrow{color:var(--accent2);font-size:13px;letter-spacing:.02em;font-weight:600;}
  header h1{margin:2px 0 0;font-size:22px;font-weight:700;letter-spacing:-.01em;}

  .warnbanner{
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(0deg, rgba(226,85,79,.12), rgba(226,85,79,.12)), var(--panel);
    border:1px solid var(--danger);color:#ffdcda;
    padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;
    margin-bottom:14px;line-height:1.4;
  }
  .warnbanner svg{flex:0 0 auto;color:var(--danger);}

  #connbanner{
    display:none;background:#3a1f1f;border:1px solid var(--danger);color:#ffd7d3;
    padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;line-height:1.5;
  }

  .countrybar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
  .countrybar::-webkit-scrollbar{display:none;}
  .country-chip{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);padding:9px 14px;border-radius:999px;font-size:14px;
    cursor:pointer;white-space:nowrap;font-weight:600;transition:.15s;
  }
  .country-chip.active{background:var(--accent2);color:#06231d;border-color:var(--accent2);}
  .country-chip .n{opacity:.75;font-weight:500;margin-left:4px;}

  .summary{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:16px;
  }
  .summary .ring{
    width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--accent2) calc(var(--pct,0)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .summary .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel);}
  .summary .ring span{position:relative;font-size:12px;font-weight:700;color:var(--accent2);}
  .summary .txt{font-size:14px;color:var(--muted);}
  .summary .txt b{color:var(--ink);font-size:16px;}

  .searchwrap{position:relative;margin-bottom:14px;}
  .searchwrap input{
    width:100%;padding:14px 16px 14px 44px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:16px;outline:none;
  }
  .searchwrap input:focus{border-color:var(--accent2);}
  .searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;}

  .filterbar{display:flex;gap:8px;margin-bottom:12px;}
  .filterbtn{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:9px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .filterbtn.active{background:var(--panel2);color:var(--ink);border-color:var(--accent2);}

  .list{display:flex;flex-direction:column;gap:8px;}
  .row{
    display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;
  }
  .row.delivered{border-color:rgba(47,191,143,.4);background:linear-gradient(0deg, rgba(47,191,143,.08), rgba(47,191,143,.08)), var(--panel);}
  .row .info{flex:1;min-width:0;}
  .row .name{font-size:15px;font-weight:600;line-height:1.3;}
  .row .name .country-tag{color:var(--accent2);font-weight:600;}
  .row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .row .note{font-size:12px;color:var(--pending);margin-top:2px;font-style:italic;}
  .row .obs{font-size:12px;color:#8fd6c4;margin-top:2px;font-style:italic;}
  .toggle{
    flex:0 0 auto;border:none;border-radius:999px;padding:10px 16px;font-size:13px;
    font-weight:700;cursor:pointer;transition:.15s;min-width:100px;
  }
  .toggle.pending{background:var(--panel2);color:var(--pending);border:1px solid var(--pending);}
  .toggle.done{background:var(--accent2);color:#06231d;}
  .toggle:active{transform:scale(.96);}

  .empty{text-align:center;color:var(--muted);padding:24px 20px 8px;font-size:14px;}

  .addpanel{
    background:var(--panel);border:1px dashed var(--accent);border-radius:var(--radius);
    padding:16px;margin-top:6px;
  }
  .addpanel .lbl{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .addpanel .row2{display:flex;gap:8px;flex-wrap:wrap;}
  .addpanel input[type=text]{
    flex:1;min-width:160px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:15px;outline:none;
  }
  .addpanel select{
    padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:15px;outline:none;
  }
  .addpanel button{
    background:var(--accent);color:#2a0f04;border:none;border-radius:10px;
    padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .addpanel button:active{transform:scale(.97);}

  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6;}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,14,15,.72);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:760px;
  }
  @media (min-width:560px){
    .modal-overlay{align-items:center;}
    .modal-card{border-radius:18px;}
  }
  .modal-card h3{margin:0 0 4px;font-size:16px;}
  .modal-card p{margin:0 0 14px;color:var(--muted);font-size:13px;}
  .modal-card textarea{
    width:100%;min-height:80px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:15px;padding:10px 12px;
    outline:none;font-family:inherit;resize:vertical;
  }
  .modal-card textarea:focus{border-color:var(--accent2);}
  .modal-actions{display:flex;gap:10px;margin-top:14px;}
  .modal-actions button{
    flex:1;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .modal-actions .cancel{background:var(--panel2);color:var(--muted);}
  .modal-actions .confirm{background:var(--accent2);color:#06231d;}
</style>

const COUNTRIES = Object.keys(RAW_DATA);

let db = null;
let firestoreOk = false;
let liveEntregas = {};
let manualPeople = {};
let currentCountry = 'Todos';
let currentFilter = 'all';

function normalize(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function slug(country, name){
  return (country + '__' + name).toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,180);
}
function todayStr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showConnBanner(msg){
  const b = document.getElementById('connbanner');
  if(!msg){ b.style.display = 'none'; return; }
  b.style.display = 'block';
  b.textContent = msg;
}

function initFirebase(){
  if(firebaseConfig.apiKey.indexOf('PEGA_TU') === 0){
    showConnBanner('Falta configurar Firebase. Mientras tanto la app funciona, pero nada se guarda ni se comparte.');
    renderAll();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firestoreOk = true;
    db.collection('entregas').onSnapshot(snap => {
      liveEntregas = {};
      snap.forEach(doc => { liveEntregas[doc.id] = doc.data(); });
      manualPeople = {};
      Object.entries(liveEntregas).forEach(([id, d]) => {
        if(d.manual) manualPeople[id] = { country: d.country, name: d.name };
      });
      renderAll();
    }, err => {
      showConnBanner('No se pudo conectar a la base de datos: ' + err.message);
    });
  }catch(e){
    showConnBanner('Error de configuración de Firebase: ' + e.message);
    renderAll();
  }
}

function getAllPeople(){
  const out = [];
  COUNTRIES.forEach(country => {
    RAW_DATA[country].forEach(p => {
      const id = slug(country, p.name);
      const live = liveEntregas[id];
      out.push({
        id, country, name: p.name,
        delivered: live ? !!live.delivered : p.delivered,
        date: live ? (live.date || '') : (p.date || ''),
        note: p.note || '',
        obs: live ? (live.obs || '') : '',
        manual: false
      });
    });
  });
  Object.entries(manualPeople).forEach(([id, m]) => {
    const live = liveEntregas[id] || {};
    out.push({
      id, country: m.country, name: m.name,
      delivered: !!live.delivered, date: live.date || '',
      note: '', obs: live.obs || '',
      manual: true
    });
  });
  return out;
}

function countryTotals(country){
  const people = getAllPeople().filter(p => country === 'Todos' || p.country === country);
  const total = people.length;
  const done = people.filter(p => p.delivered).length;
  return {total, done};
}

function renderCountryBar(){
  const bar = document.getElementById('countrybar');
  bar.innerHTML = '';
  const allChip = document.createElement('div');
  const allTotal = getAllPeople().length;
  allChip.className = 'country-chip' + (currentCountry === 'Todos' ? ' active' : '');
  allChip.innerHTML = 'Todos<span class="n">' + allTotal + '</span>';
  allChip.onclick = () => { currentCountry = 'Todos'; renderAll(); };
  bar.appendChild(allChip);

  COUNTRIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'country-chip' + (c === currentCountry ? ' active' : '');
    const total = RAW_DATA[c].length;
    chip.innerHTML = c + '<span class="n">' + total + '</span>';
    chip.onclick = () => { currentCountry = c; renderAll(); };
    bar.appendChild(chip);
  });
}

function renderSummary(){
  const {total, done} = countryTotals(currentCountry);
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('summary').style.display = 'flex';
  document.getElementById('ring').style.setProperty('--pct', pct);
  document.getElementById('ringtxt').textContent = pct + '%';
  document.getElementById('summarytxt').innerHTML =
    '<b>' + done + ' de ' + total + '</b> entregados' + (currentCountry === 'Todos' ? ' en total' : ' en ' + currentCountry);
}

function renderList(){
  const list = document.getElementById('list');
  const q = normalize(document.getElementById('search').value.trim());

        (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') +
        (p.obs ? '<div class="obs">' + esc(p.obs) + '</div>' : '') +
      '</div>' +
      '<button class="toggle ' + (p.delivered ? 'done' : 'pending') + '">' +
        (p.delivered ? '✓ Entregado' : 'Marcar') +
      '</button>';
    row.querySelector('.toggle').onclick = () => onToggleClick(p);
    list.appendChild(row);
  });

  if(q) list.appendChild(renderAddPanel(document.getElementById('search').value.trim()));
}

function renderAddPanel(prefillName){
  const panel = document.createElement('div');
  panel.className = 'addpanel';
  const options = COUNTRIES.map(c => '<option value="' + c + '">' + c + '</option>').join('');
  panel.innerHTML =
    '<div class="lbl">¿No está en la lista? Agregalo y asignale una delegación.</div>' +
    '<div class="row2">' +
      '<input type="text" id="newname" placeholder="Nombre y apellido" value="' + esc(prefillName) + '">' +
      '<select id="newcountry">' + options + '</select>' +
      '<button id="addbtn">Agregar y marcar entregado</button>' +
    '</div>';
  panel.querySelector('#addbtn').onclick = () => {
    const name = document.getElementById('newname').value.trim();
    const country = document.getElementById('newcountry').value;
    if(!name) return;
    openObsModal(name, country, (obs) => addManualAthlete(name, country, obs));
  };
  return panel;
}

function openObsModal(name, country, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-card">' +
      '<h3>Marcar entrega — ' + esc(name) + '</h3>' +
      '<p>' + esc(country) + ' · si es necesario, dejá una observación (opcional).</p>' +
      '<textarea id="obsinput" placeholder="Ej: se entregó a un familiar, no estaba en la planilla, etc."></textarea>' +
      '<div class="modal-actions">' +
        '<button class="cancel" id="obscancel">Cancelar</button>' +
        '<button class="confirm" id="obsconfirm">Confirmar entrega</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector('#obscancel').onclick = close;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  overlay.querySelector('#obsconfirm').onclick = () => {
    const obs = overlay.querySelector('#obsinput').value.trim();
    close();
    onConfirm(obs);
  };
}

function onToggleClick(p){
  if(!p.delivered){
    openObsModal(p.name, p.country, (obs) => doSetDelivered(p, true, obs));
  }else{
    doSetDelivered(p, false, '');
  }
}

async function doSetDelivered(p, delivered, obs){
  const payload = {
    country: p.country, name: p.name,
    delivered: delivered,
    date: delivered ? todayStr() : '',
    obs: delivered ? obs : '',
    manual: !!p.manual
  };
  if(firestoreOk){
    try{
      await db.collection('entregas').doc(p.id).set(payload, {merge:true});
    }catch(e){
      showConnBanner('No se pudo guardar el cambio: ' + e.message);
    }
  }else{
    liveEntregas[p.id] = payload;
    renderAll();
  }
}

async function addManualAthlete(name, country, obs){
  const id = slug(country, name);
  manualPeople[id] = { country, name };
  const payload = { country, name, delivered: true, date: todayStr(), obs: obs || '', manual: true };
  if(firestoreOk){
    try{
      await db.collection('entregas').doc(id).set(payload);
    }catch(e){
      showConnBanner('No se pudo guardar: ' + e.message);
    }
  }else{
    liveEntregas[id] = payload;
  }
  document.getElementById('search').value = '';
  currentCountry = country;
  renderAll();
}

function renderAll(){
  renderCountryBar();
  renderSummary();
  renderList();
}

document.getElementById('search').addEventListener('input', renderList);
document.querySelectorAll('.filterbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filterbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

initFirebase();
</script>
</body>
</html>
